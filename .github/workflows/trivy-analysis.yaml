name: Trivy Analysis

permissions:
  contents: read
  actions: read
  security-events: write

on:
  pull_request:
  workflow_dispatch:
  push:

env:
  SARIF_FILE: 'trivy-results.sarif'

jobs:
  build:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy vulnerability scanner on the cloned repository files
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: 'v0.69.3'
          scan-type: 'fs'
          scanners: 'vuln,misconfig,secret'
          ignore-unfixed: true
          format: 'sarif'
          output: ${{ env.SARIF_FILE }}
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'

      - name: Print exact Trivy error details when scan fails
        if: steps.trivy_scan.outcome == 'failure'
        run: |
          echo "Trivy action step failed. Running direct Trivy CLI in debug mode to show exact error."
          trivy --version || true
          trivy fs --debug \
            --scanners vuln,misconfig,secret \
            --ignore-unfixed \
            --format sarif \
            --output "${{ env.SARIF_FILE }}" \
            . 2>&1 | tee trivy-debug.log || true
          echo "----- Trivy debug output (last 200 lines) -----"
          tail -n 200 trivy-debug.log || true
          exit 1

      - name: Check Trivy scan results existence
        if: steps.trivy_scan.outcome == 'success'
        run: |
          if [ ! -f "${{ env.SARIF_FILE }}" ]; then
            echo "Error: ${{ env.SARIF_FILE }} does not exist."
            exit 1
          fi
          ls -lash ${{ env.SARIF_FILE }}

      - name: Upload Trivy scan results to GitHub Security tab
        if: steps.trivy_scan.outcome == 'success'
        uses: github/codeql-action/upload-sarif@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
        with:
          sarif_file: ${{ env.SARIF_FILE }}
