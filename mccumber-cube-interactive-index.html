<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The McCumber Cube - Information Security Framework</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    padding: 30px 20px 10px;
    position: relative;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 6px;
  }

  header p.subtitle {
    color: #94a3b8;
    font-size: 0.95rem;
    max-width: 720px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* Language switcher */
  .lang-switcher {
    position: absolute;
    top: 16px;
    right: 24px;
    display: flex;
    gap: 4px;
    background: #1e293b;
    border-radius: 8px;
    padding: 3px;
    border: 1px solid #334155;
  }

  .lang-btn {
    background: transparent;
    color: #94a3b8;
    border: none;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.2s;
  }

  .lang-btn:hover { color: #f8fafc; }

  .lang-btn.active {
    background: #6366f1;
    color: #fff;
  }

  .main-layout {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    padding: 20px 30px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ---- 3D CUBE ---- */
  .cube-container {
    width: 420px;
    height: 420px;
    perspective: 1200px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .cube-scene {
    width: 260px;
    height: 260px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-25deg) rotateY(-35deg);
    transition: transform 0.6s ease;
  }

  .cube-scene.spin {
    animation: slowSpin 30s linear infinite;
  }

  @keyframes slowSpin {
    from { transform: rotateX(-25deg) rotateY(-35deg); }
    to   { transform: rotateX(-25deg) rotateY(325deg); }
  }

  .cube-face {
    position: absolute;
    width: 260px;
    height: 260px;
    border: 2px solid rgba(148, 163, 184, 0.3);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    backface-visibility: visible;
  }

  .cube-face.front  { transform: translateZ(130px); }
  .cube-face.back   { transform: rotateY(180deg) translateZ(130px); }
  .cube-face.right  { transform: rotateY(90deg) translateZ(130px); }
  .cube-face.left   { transform: rotateY(-90deg) translateZ(130px); }
  .cube-face.top    { transform: rotateX(90deg) translateZ(130px); }
  .cube-face.bottom { transform: rotateX(-90deg) translateZ(130px); }

  .cube-cell {
    border: 1px solid rgba(148, 163, 184, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.5rem;
    font-weight: 600;
    text-align: center;
    padding: 2px;
    line-height: 1.15;
    cursor: pointer;
    transition: all 0.25s ease;
    color: rgba(255,255,255,0.85);
  }

  .cube-cell:hover {
    transform: scale(1.05);
    z-index: 10;
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
  }

  .cube-cell.highlight {
    box-shadow: 0 0 14px rgba(99, 102, 241, 0.8);
    outline: 2px solid #a5b4fc;
  }

  .cube-face.front  .cube-cell { background: rgba(99, 102, 241, 0.35); }
  .cube-face.back   .cube-cell { background: rgba(99, 102, 241, 0.18); }
  .cube-face.right  .cube-cell { background: rgba(16, 185, 129, 0.35); }
  .cube-face.left   .cube-cell { background: rgba(16, 185, 129, 0.18); }
  .cube-face.top    .cube-cell { background: rgba(245, 158, 11, 0.35); }
  .cube-face.bottom .cube-cell { background: rgba(245, 158, 11, 0.18); }

  .cube-controls {
    text-align: center;
    margin-top: 8px;
  }

  .cube-controls button {
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    margin: 0 4px;
    transition: all 0.2s;
  }

  .cube-controls button:hover,
  .cube-controls button.active {
    background: #334155;
    color: #f8fafc;
    border-color: #6366f1;
  }

  .cube-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .axis-labels {
    display: flex;
    gap: 20px;
    margin-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .axis-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: #cbd5e1;
  }

  .axis-dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }

  .axis-dot.x { background: #6366f1; }
  .axis-dot.y { background: #10b981; }
  .axis-dot.z { background: #f59e0b; }

  /* ---- RIGHT PANEL ---- */
  .right-panel {
    flex: 1;
    min-width: 320px;
    max-width: 580px;
  }

  .dim-cards {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 20px;
  }

  .dim-card {
    background: #1e293b;
    border-radius: 10px;
    padding: 16px 18px;
    border-left: 4px solid;
    transition: all 0.25s;
  }

  .dim-card.x-card { border-color: #6366f1; }
  .dim-card.y-card { border-color: #10b981; }
  .dim-card.z-card { border-color: #f59e0b; }

  .dim-card h3 {
    font-size: 0.95rem;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dim-card .badge {
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 4px;
    color: #fff;
    font-weight: 700;
  }

  .x-card .badge { background: #6366f1; }
  .y-card .badge { background: #10b981; }
  .z-card .badge { background: #f59e0b; }

  .dim-card .items {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .dim-card .item {
    background: #0f172a;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid #334155;
  }

  .dim-card .item:hover {
    border-color: #6366f1;
    color: #f8fafc;
  }

  .dim-card .item.selected {
    border-color: #6366f1;
    background: #312e81;
    color: #fff;
  }

  .detail-panel {
    background: #1e293b;
    border-radius: 10px;
    padding: 20px;
    min-height: 180px;
    border: 1px solid #334155;
  }

  .detail-panel h3 {
    font-size: 1rem;
    margin-bottom: 10px;
    color: #f8fafc;
  }

  .detail-panel .combo-label {
    font-size: 0.75rem;
    color: #94a3b8;
    margin-bottom: 12px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .combo-label .tag {
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.7rem;
  }

  .combo-label .tag.x { background: rgba(99,102,241,0.25); color: #a5b4fc; }
  .combo-label .tag.y { background: rgba(16,185,129,0.25); color: #6ee7b7; }
  .combo-label .tag.z { background: rgba(245,158,11,0.25); color: #fcd34d; }

  .detail-panel p {
    font-size: 0.85rem;
    line-height: 1.55;
    color: #cbd5e1;
    margin-bottom: 8px;
  }

  .detail-panel .example {
    background: #0f172a;
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 8px;
    border-left: 3px solid #6366f1;
  }

  .detail-panel .example strong {
    color: #a5b4fc;
    font-size: 0.8rem;
  }

  .detail-panel .example p {
    font-size: 0.8rem;
    margin-top: 4px;
    color: #94a3b8;
  }

  /* ---- GRID TABLE ---- */
  .grid-section {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  .grid-section h2 {
    text-align: center;
    font-size: 1.3rem;
    margin-bottom: 16px;
    color: #f8fafc;
  }

  .grid-section p.sub {
    text-align: center;
    color: #94a3b8;
    font-size: 0.85rem;
    margin-bottom: 20px;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  .matrix-wrapper { overflow-x: auto; }

  table.matrix {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.72rem;
    background: #1e293b;
    border-radius: 10px;
    overflow: hidden;
    table-layout: fixed;
  }

  table.matrix th, table.matrix td {
    padding: 8px 6px;
    text-align: left;
    border: 1px solid #334155;
    vertical-align: top;
    word-wrap: break-word;
    overflow-wrap: break-word;
    hyphens: auto;
  }

  table.matrix thead th {
    background: #334155;
    color: #f8fafc;
    font-weight: 700;
    text-align: center;
  }

  table.matrix th.row-header {
    background: #263348;
    font-weight: 700;
    color: #e2e8f0;
    width: 100px;
    text-align: center;
  }

  table.matrix td {
    color: #cbd5e1;
    line-height: 1.45;
  }

  table.matrix .conf { background: rgba(99,102,241,0.08); }
  table.matrix .intg { background: rgba(16,185,129,0.08); }
  table.matrix .avail { background: rgba(245,158,11,0.08); }

  table.matrix td:hover {
    background: rgba(99,102,241,0.15);
    cursor: pointer;
  }

  table.matrix td.highlight {
    background: rgba(99,102,241,0.25) !important;
    outline: 2px solid #6366f1;
    outline-offset: -2px;
  }

  footer {
    text-align: center;
    padding: 20px;
    color: #475569;
    font-size: 0.75rem;
  }

  @media (max-width: 900px) {
    .main-layout { flex-direction: column; align-items: center; }
    .right-panel { max-width: 100%; }
    .cube-container { width: 340px; height: 340px; }
    .lang-switcher { position: static; margin: 10px auto 0; }
  }
</style>
</head>
<body>

<header>

    <button class="lang-btn active" onclick="setLang('en')">EN</button>

  <div class="right-panel">

</div>

<div class="grid-section">

  <div class="matrix-wrapper">

</div>

let lang = 'en';
let L = T.en;
const sel = [null, null, null];

function setLang(l) {
  lang = l;
  L = T[l];
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === l.toUpperCase()));
  document.documentElement.lang = l;
  sel[0] = sel[1] = sel[2] = null;
  renderAll();
}

function renderAll() {
  document.title = L.pageTitle;
  document.getElementById('pageTitle').textContent = L.pageTitle;
  document.getElementById('pageSubtitle').textContent = L.pageSubtitle;
  document.getElementById('btnSpin').textContent = L.btnSpin;
  document.getElementById('btnReset').textContent = L.btnReset;
  document.getElementById('gridTitle').textContent = L.gridTitle;
  document.getElementById('gridSubtitle').textContent = L.gridSubtitle;
  document.getElementById('footerText').textContent = L.footer;

  document.getElementById('axisLabels').innerHTML =
    '<div class="axis-label"><div class="axis-dot x"></div> '+L.axisGoals+'</div>' +
    '<div class="axis-label"><div class="axis-dot y"></div> '+L.axisStates+'</div>' +
    '<div class="axis-label"><div class="axis-dot z"></div> '+L.axisMeasures+'</div>';

  const cards = document.getElementById('dimCards');
  const cls = ['x-card','y-card','z-card'];
  const titles = [L.dim1, L.dim2, L.dim3];
  const lists = [L.goals, L.states, L.measures];
  let html = '';
  for (let d = 0; d < 3; d++) {
    html += '<div class="dim-card '+cls[d]+'"><h3><span class="badge">'+L.dimBadge[d]+'</span> '+titles[d]+'</h3><div class="items">';
    for (let i = 0; i < lists[d].length; i++) {
      html += '<div class="item" data-dim="'+d+'" data-idx="'+i+'" onclick="clickDimItem(this)">'+lists[d][i]+'</div>';
    }
    html += '</div></div>';
  }
  cards.innerHTML = html;

  buildMatrix();

  buildFaces();

  updateDetail();
}

const faceMap = {
  front: [
    [0,0,2],[0,1,2],[0,2,2],
    [1,0,2],[1,1,2],[1,2,2],
    [2,0,2],[2,1,2],[2,2,2]
  ],
  right: [
    [2,0,0],[2,0,1],[2,0,2],
    [2,1,0],[2,1,1],[2,1,2],
    [2,2,0],[2,2,1],[2,2,2]
  ],
  top: [
    [0,2,0],[0,2,1],[0,2,2],
    [1,2,0],[1,2,1],[1,2,2],
    [2,2,0],[2,2,1],[2,2,2]
  ]
};

function cellLabel(g,s,m) {
  return L.goalsShort[g] + ' ' + L.statesShort[s] + ' ' + L.measuresShort[m];
}

function cellTooltip(g,s,m) {
  return L.goals[g] + ' + ' + L.states[s] + ' + ' + L.measures[m];
}

function buildFaces() {
  ['front','right','top'].forEach(face => {
    const el = document.getElementById('face' + face.charAt(0).toUpperCase() + face.slice(1));
    if (!el) return;
    const cells = faceMap[face];
    el.innerHTML = '';
    cells.forEach(([g,s,m]) => {
      const cell = document.createElement('div');
      cell.className = 'cube-cell';
      cell.textContent = cellLabel(g,s,m);
      cell.title = cellTooltip(g,s,m);
      cell.addEventListener('click', function(e) {
        e.stopPropagation();
        cubeCellClick(g,s,m);
      });
      el.appendChild(cell);
    });
  });

  ['back','left','bottom'].forEach(cls => {
    const face = document.querySelector('.cube-face.'+cls);
    if (!face) return;
    face.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cube-cell';
      cell.style.opacity = '0.5';
      face.appendChild(cell);
    }
  });
}

function cubeCellClick(g,s,m) {
  sel[0] = g; sel[1] = s; sel[2] = m;
  syncAll();
  document.getElementById('detailPanel').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function clickDimItem(el) {
  const d = parseInt(el.dataset.dim);
  const i = parseInt(el.dataset.idx);
  if (sel[d] === i) { sel[d] = null; } else { sel[d] = i; }
  syncAll();
}

function syncAll() {
  syncDimButtons();
  syncCubeHighlight();
  syncMatrixHighlight();
  updateDetail();
}

function syncDimButtons() {
  const items = document.querySelectorAll('.dim-card .item');
  items.forEach(it => {
    const d = parseInt(it.dataset.dim);
    const i = parseInt(it.dataset.idx);
    it.classList.toggle('selected', sel[d] === i);
  });
}

function cellMatches(g, s, m) {
  return (sel[0] === null || sel[0] === g) &&
         (sel[1] === null || sel[1] === s) &&
         (sel[2] === null || sel[2] === m) &&
         (sel[0] !== null || sel[1] !== null || sel[2] !== null);
}

function syncCubeHighlight() {
  ['front','right','top'].forEach(face => {
    const el = document.getElementById('face' + face.charAt(0).toUpperCase() + face.slice(1));
    if (!el) return;
    const cells = faceMap[face];
    const children = el.children;
    for (let i = 0; i < cells.length; i++) {
      const [g,s,m] = cells[i];
      children[i].classList.toggle('highlight', cellMatches(g,s,m));
    }
  });
}

function syncMatrixHighlight() {
  const tds = document.querySelectorAll('#matrixTable td[data-g]');
  tds.forEach(td => {
    const g = parseInt(td.dataset.g);
    const s = parseInt(td.dataset.s);
    const m = parseInt(td.dataset.m);
    td.classList.toggle('highlight', cellMatches(g,s,m));
  });
}

function comboIndex(g, s, m) {
  return m * 9 + g * 3 + s;
}

function updateDetail() {
  const panel = document.getElementById('detailPanel');
  const filled = sel.filter(x => x !== null).length;
  const lists = [L.goals, L.states, L.measures];
  const clsArr = ['x','y','z'];

  if (filled === 0) {
    panel.innerHTML = '<h3>'+L.selectCombo+'</h3><p>'+L.selectComboDesc+'</p>' +
      '<div class="example"><strong>'+L.howToRead+'</strong><p>'+L.howToReadDesc+'</p></div>';
  } else if (filled === 1) {
    const dim = sel.findIndex(x => x !== null);
    const name = lists[dim][sel[dim]];
    const descKey = ['g','s','m'][dim] + sel[dim];
    panel.innerHTML = '<h3>'+name+'</h3>' +
      '<div class="combo-label"><span class="tag '+clsArr[dim]+'">'+L.dimNames[dim]+'</span></div>' +
      '<p>'+L.descs[descKey]+'</p>';
  } else if (filled === 2) {
    let html = '<h3>'+L.selectMore+'</h3><div class="combo-label">';
    sel.forEach((v,i) => { if (v !== null) html += '<span class="tag '+clsArr[i]+'">'+lists[i][v]+'</span>'; });
    html += '</div><p>'+L.selectMoreDesc+'</p>';
    panel.innerHTML = html;
  } else {
    const ci = comboIndex(sel[0], sel[1], sel[2]);
    const combo = L.combos[ci];
    let html = '<h3>'+combo[0]+'</h3><div class="combo-label">';
    sel.forEach((v,i) => { html += '<span class="tag '+clsArr[i]+'">'+lists[i][v]+'</span>'; });
    html += '</div><p>'+combo[1]+'</p>';
    html += '<div class="example"><strong>'+L.goals[sel[0]]+' + '+L.states[sel[1]]+' + '+L.measures[sel[2]]+'</strong>';
    html += '<p>'+L.cellOf27+'</p></div>';
    panel.innerHTML = html;
  }
}

function buildMatrix() {
  const tbl = document.getElementById('matrixTable');
  let html = '<thead><tr><th></th>';
  for (let g = 0; g < 3; g++) {
    const bgColors = ['rgba(99,102,241,0.3)','rgba(16,185,129,0.3)','rgba(245,158,11,0.3)'];
    html += '<th colspan="3" style="background:'+bgColors[g]+'">'+L.goals[g]+'</th>';
  }
  html += '</tr><tr><th></th>';
  const cellCls = ['conf','conf','conf','intg','intg','intg','avail','avail','avail'];
  for (let g = 0; g < 3; g++) {
    for (let s = 0; s < 3; s++) {
      html += '<th class="'+cellCls[g*3]+'">'+L.states[s]+'</th>';
    }
  }
  html += '</tr></thead><tbody>';
  for (let m = 0; m < 3; m++) {
    html += '<tr><th class="row-header">'+L.measures[m]+'</th>';
    for (let g = 0; g < 3; g++) {
      for (let s = 0; s < 3; s++) {
        const cls = ['conf','intg','avail'][g];
        html += '<td class="'+cls+'" data-g="'+g+'" data-s="'+s+'" data-m="'+m+'" onclick="matrixCellClick(this)">'+L.matrix[m][g*3+s]+'</td>';
      }
    }
    html += '</tr>';
  }
  html += '</tbody>';
  tbl.innerHTML = html;
}

function matrixCellClick(el) {
  const g = parseInt(el.dataset.g);
  const s = parseInt(el.dataset.s);
  const m = parseInt(el.dataset.m);
  cubeCellClick(g,s,m);
}

let spinning = true;
function toggleSpin() {
  spinning = !spinning;
  const scene = document.getElementById('cubeScene');
  const btn = document.getElementById('btnSpin');
  if (spinning) { scene.classList.add('spin'); btn.classList.add('active'); }
  else { scene.classList.remove('spin'); btn.classList.remove('active'); }
}

function resetCube() {
  const scene = document.getElementById('cubeScene');
  scene.classList.remove('spin');
  spinning = false;
  document.getElementById('btnSpin').classList.remove('active');
  rotX = -25;
  rotY = -35;
  scene.style.transition = 'transform 0.6s ease';
  scene.style.transform = 'rotateX(-25deg) rotateY(-35deg)';
}

let isDragging = false, startX, startY, rotX = -25, rotY = -35;
const cubeContainer = document.querySelector('.cube-container');

cubeContainer.addEventListener('mousedown', e => {
  if (spinning) toggleSpin();
  isDragging = true;
  startX = e.clientX;
  startY = e.clientY;
  document.getElementById('cubeScene').style.transition = 'none';
});

document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  rotY += dx * 0.5;
  rotX -= dy * 0.5;
  document.getElementById('cubeScene').style.transform = 'rotateX('+rotX+'deg) rotateY('+rotY+'deg)';
  startX = e.clientX;
  startY = e.clientY;
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  document.getElementById('cubeScene').style.transition = 'transform 0.6s ease';
});

renderAll();
</script>
</body>
</html>
