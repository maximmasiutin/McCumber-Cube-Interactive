<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSI Reference Model / Modelul OSI / Modeli OSI</title>
<style>
@font-face {
  font-family: 'HelveticaNeueWorld';
  src: url('../../../../Fonts/HelveticaNeueWorld/HelveticaNeueWorld-55Roman.otf') format('opentype');
  font-weight: 400;
}
@font-face {
  font-family: 'HelveticaNeueWorld';
  src: url('../../../../Fonts/HelveticaNeueWorld/HelveticaNeueWorld-75Bold.otf') format('opentype');
  font-weight: 700;
}
@font-face {
  font-family: 'HelveticaNeueWorld';
  src: url('../../../../Fonts/HelveticaNeueWorld/HelveticaNeueWorld-45Lt.otf') format('opentype');
  font-weight: 300;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'HelveticaNeueWorld', 'Helvetica Neue', Arial, sans-serif;
  background: #0a0a2e;
  color: #e0e0e0;
  min-height: 100vh;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 2em;
  margin-bottom: 8px;
  color: #fff;
}

.subtitle {
  text-align: center;
  font-weight: 300;
  font-size: 1.1em;
  color: #8888cc;
  margin-bottom: 24px;
}

.lang-switch {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 30px;
}

.lang-btn {
  padding: 10px 28px;
  border: 2px solid #4444aa;
  background: transparent;
  color: #aaaaee;
  font-family: inherit;
  font-size: 1em;
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.2s;
}

.lang-btn:hover { background: #222266; }
.lang-btn.active { background: #3333aa; color: #fff; border-color: #6666dd; }

.osi-stack {
  max-width: 800px;
  margin: 0 auto 40px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.layer {
  display: grid;
  grid-template-columns: 60px 60px 1fr 200px;
  align-items: center;
  padding: 14px 18px;
  border-radius: 8px;
  transition: transform 0.15s, box-shadow 0.15s;
  cursor: default;
}

.layer:hover {
  transform: scale(1.02);
  box-shadow: 0 4px 20px rgba(100,100,255,0.3);
}

.layer-num {
  font-size: 1.8em;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
}

.layer-emoji {
  font-size: 2em;
  text-align: center;
}

.layer-info {
  padding-left: 12px;
}

.layer-name {
  font-size: 1.3em;
  font-weight: 700;
  color: #fff;
}

.layer-desc {
  font-weight: 300;
  font-size: 0.9em;
  color: rgba(255,255,255,0.7);
  margin-top: 2px;
}

.layer-protocols {
  text-align: right;
  font-size: 0.85em;
  font-weight: 300;
  color: rgba(255,255,255,0.5);
}

@media (max-width: 760px) {
  .layer {
    grid-template-columns: 44px 44px 1fr;
    gap: 6px;
  }
  .layer-protocols {
    grid-column: 1 / -1;
    text-align: left;
    padding-left: 56px;
  }
}

.layer-7 { background: linear-gradient(135deg, #7b2d8e, #5a1f6b); }
.layer-6 { background: linear-gradient(135deg, #3b5998, #2d4373); }
.layer-5 { background: linear-gradient(135deg, #1a6b4a, #0f4f35); }
.layer-4 { background: linear-gradient(135deg, #b8860b, #8b6508); }
.layer-3 { background: linear-gradient(135deg, #c0392b, #962d22); }
.layer-2 { background: linear-gradient(135deg, #2874a6, #1b5c82); }
.layer-1 { background: linear-gradient(135deg, #555, #333); }

.section-title {
  text-align: center;
  font-size: 1.4em;
  margin: 30px 0 16px;
  color: #aaaaee;
}

.mnemonics {
  max-width: 800px;
  margin: 0 auto 40px;
}

.mnemonic-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 14px 20px;
  margin-bottom: 8px;
}

.mnemonic-card .direction {
  font-size: 0.8em;
  color: #8888cc;
  margin-bottom: 4px;
}

.mnemonic-card .phrase {
  font-size: 1.1em;
  color: #fff;
}

.mnemonic-card .phrase b {
  color: #ffcc44;
  font-weight: 700;
}

.footer {
  text-align: center;
  font-size: 0.85em;
  color: #555;
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid #222;
}
</style>
</head>
<body>

<p class="subtitle" id="subtitle">Open Systems Interconnection - 7 Layers</p>

<div class="lang-switch">

<h2 class="section-title" id="mnemonic-title">Mnemonic Phrases</h2>
<div class="mnemonics" id="mnemonics"></div>

<div class="footer">

      { num: 5, name: "\u0421\u0435\u0430\u043D\u0441\u043E\u0432\u044B\u0439", desc: "\u0423\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u0441\u0435\u0430\u043D\u0441\u0430\u043C\u0438 \u0438 \u0441\u043E\u0435\u0434\u0438\u043D\u0435\u043D\u0438\u044F\u043C\u0438", protocols: "NetBIOS, RPC, PPTP", emoji: "\uD83E\uDD1D" },

let currentLang = 'en';

function setLang(lang) {
  if (!Object.prototype.hasOwnProperty.call(data, lang)) return;
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  const activeBtn = document.querySelector(`.lang-btn[data-lang="${lang}"]`);
  if (activeBtn) activeBtn.classList.add('active');
  render();
}

function render() {
  const d = data[currentLang];
  document.getElementById('title').textContent = d.title;
  document.getElementById('subtitle').textContent = d.subtitle;
  document.getElementById('mnemonic-title').textContent = d.mnemonicTitle;

  const stack = document.getElementById('osi-stack');
  stack.innerHTML = d.layers.map(l =>
    '<div class="layer layer-' + l.num + '">' +
      '<div class="layer-num">' + l.num + '</div>' +
      '<div class="layer-emoji">' + l.emoji + '</div>' +
      '<div class="layer-info">' +
        '<div class="layer-name">' + l.name + '</div>' +
        '<div class="layer-desc">' + l.desc + '</div>' +
      '</div>' +
      '<div class="layer-protocols">' + l.protocols + '</div>' +
    '</div>'
  ).join('');

  const mn = document.getElementById('mnemonics');
  mn.innerHTML = d.mnemonics.map(m =>
    '<div class="mnemonic-card">' +
      '<div class="direction">' + m.dir + '</div>' +
      '<div class="phrase">' + m.phrase + '</div>' +
    '</div>'
  ).join('');
}

render();
</script>

</html>
